[package]
name = "camera-toolbox-web"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = ["platform-ssh", "calibration-opencv"]
product-all = ["platform-all", "calibration-opencv"]
platform-all = ["platform-local", "platform-cv610", "platform-ssh"]
platform-local = ["camera-toolbox-adapters/platform-local"]
platform-cv610 = ["camera-toolbox-adapters/platform-cv610"]
platform-ssh = ["camera-toolbox-adapters/platform-ssh"]
calibration-opencv = ["camera-toolbox-adapters/calibration-opencv"]
hex-arm-control = ["camera-toolbox-adapters/hex-arm-control"]
[[bin]]
name = "camera-toolbox-web"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
async-stream.workspace = true
bytes.workspace = true
camera-toolbox-adapters.workspace = true
camera-toolbox-app.workspace = true
camera-toolbox-core.workspace = true
camera-toolbox-logging.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
tokio.workspace = true
futures-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
secrecy.workspace = true

[lints]
workspace = true
