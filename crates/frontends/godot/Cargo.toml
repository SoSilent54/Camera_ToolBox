[package]
name = "pongbot-calib-tool"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5", features = ["api-4-4"] }
camera-toolbox-app = { workspace = true }
camera-toolbox-core = { workspace = true }
camera-toolbox-adapters = { workspace = true, features = ["platform-local", "platform-ssh", "calibration-opencv"] }
image.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# gdext 的 `#[gdextension]` 宏展开需要 unsafe；覆盖 workspace 的 forbid。
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
