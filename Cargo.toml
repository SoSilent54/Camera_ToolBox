[workspace]
members = [
    "crates/core",
    "crates/app",
    "crates/adapters",
    "crates/logging",
    "crates/ffmpeg-bridge",
    "crates/i2c-helper",
    "crates/frontends/imgui",
]

resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.4"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
directories = "6.0"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
opencv = { version = "=0.99.0", default-features = false, features = [
    "calib",
    "clang-runtime",
    "geometry",
    "imgcodecs",
    "imgproc",
    "objdetect",
] }
notify = "8.2"
ffmpeg-next = { version = "=8.1.0", default-features = false, features = ["codec", "format", "software-scaling"] }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3"
secrecy = "0.10"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
socket2 = "0.5"
i2cdev = "0.6.2"
fs2 = "0.4.3"
imgui = "0.12"
imgui-winit-support = "0.13"
imgui-glow-renderer = "0.13"
glow = "0.14"
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "glx", "x11", "wgl"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "glx", "x11", "wgl"] }
raw-window-handle = "0.6"

camera-toolbox-core = { path = "crates/core" }
camera-toolbox-app = { path = "crates/app" }
camera-toolbox-logging = { path = "crates/logging" }
camera-toolbox-adapters = { path = "crates/adapters", default-features = false }
camera-toolbox-ffmpeg-bridge = { path = "crates/ffmpeg-bridge" }

# Cargo 不支持项目级默认 profile；让普通 build/run 采用 release 等价代码生成。
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
