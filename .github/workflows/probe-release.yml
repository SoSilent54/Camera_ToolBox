name: Probe release PATCH/UPLOAD

on:
  push:
    tags: ["probe-*"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe PATCH and UPLOAD on existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          echo "=== PATCH existing release 377607038 ==="
          code="$(curl -s -o /tmp/p.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SoSilent54/Camera_ToolBox/releases/377607038 \
            -d '{"name":"v0.1.0-calib (patched by probe)"}')"
          echo "PATCH: ${code}"
          head -c 400 /tmp/p.json
          echo
          echo "=== UPLOAD asset to existing release ==="
          echo "probe" > /tmp/probe.txt
          code="$(curl -s -o /tmp/u.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/SoSilent54/Camera_ToolBox/releases/377607038/assets?name=probe.txt" \
            --data-binary @/tmp/probe.txt)"
          echo "UPLOAD: ${code}"
          head -c 400 /tmp/u.json
          echo
          echo "=== RESTORE release name ==="
          curl -s -o /dev/null -w 'RESTORE: %{http_code}\n' -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/SoSilent54/Camera_ToolBox/releases/377607038 \
            -d '{"name":"v0.1.0-calib"}'
