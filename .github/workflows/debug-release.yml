name: Debug release 403

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe POST /releases with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SoSilent54/Camera_ToolBox/releases \
            -d '{"tag_name":"v0.1.0-calib-test","name":"debug-403-probe"}')"
          echo "HTTP $code"
          cat /tmp/r.json
