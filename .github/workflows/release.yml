name: Release

# pongbot-calib-tool 独立发布流水线（原生 ImGui + winit 前端）。
# 仅存在于 calib_tool_godot 分支；tag v* 推送或手动触发。
# 平台矩阵：Windows x86_64、Linux x86_64（Ubuntu 20.04 / 22.04）、macOS arm64；
# i2c-helper 静态 sidecar 随各平台发布包附带。

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${RELEASE_TAG}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must be a safe semantic version like v0.1.0 or v0.1.0-rc.1: ${version}" >&2
            exit 1
          fi
          echo "release_version=${version}" >> "${GITHUB_OUTPUT}"

  build-i2c-helper-linux-aarch64:
    name: Build static Linux AArch64 I2C helper
    needs: validate-release
    runs-on: ubuntu-22.04-arm
    container:
      image: ubuntu:20.04

    steps:
      - name: Install helper build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            pkg-config
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build static helper
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-gnu \
            --package camera-i2c-helper \
            --bin camera-i2c-helper
          helper=target/aarch64-unknown-linux-gnu/release/camera-i2c-helper
          file "$helper" | grep -Eq 'ELF 64-bit LSB.*ARM aarch64'
          if readelf -l "$helper" | grep -q 'Requesting program interpreter'; then
            echo 'I2C helper must be statically linked' >&2
            exit 1
          fi
      - name: Upload Linux AArch64 helper
        uses: actions/upload-artifact@v4
        with:
          name: i2c-helper-linux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/camera-i2c-helper
          if-no-files-found: error

  build-windows:
    name: Build windows-x86_64
    needs:
      - validate-release
      - build-i2c-helper-linux-aarch64
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download Linux AArch64 I2C helper
        uses: actions/download-artifact@v4
        with:
          name: i2c-helper-linux-aarch64
          path: helper-sidecar
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --yes --no-progress
      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare pinned OpenCV 5 dependency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/opencv5_dependency.py prepare \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
      - name: Prepare pinned FFmpeg dependency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ffmpeg_dependency.py prepare \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build native ImGui frontend
        shell: pwsh
        run: |
          cargo build --release --locked -p pongbot-calib-tool
          if (-not (Test-Path target/release/pongbot-calib-tool.exe)) { throw "pongbot-calib-tool.exe 未生成" }
      - name: Package Windows release
        shell: pwsh
        run: |
          $bundle = "pongbot-calib-tool-windows-x86_64"
          $archive = "pongbot-calib-tool-$env:RELEASE_VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$bundle" | Out-Null
          Copy-Item "target/release/pongbot-calib-tool.exe" "dist/$bundle/"
          Copy-Item "helper-sidecar/camera-i2c-helper" "dist/$bundle/camera-i2c-helper-linux-aarch64"
          Copy-Item README.md "dist/$bundle/"
          & $env:PYTHON scripts/opencv5_dependency.py bundle --destination "dist/$bundle"
          & $env:PYTHON scripts/ffmpeg_dependency.py bundle --destination "dist/$bundle"
          # 冒烟：--version 不初始化窗口/GL，直接验证二进制可执行且依赖 bundle 齐全。
          $versionOut = & "dist/$bundle/pongbot-calib-tool.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "pongbot-calib-tool.exe --version failed with exit $LASTEXITCODE" }
          if ("$versionOut" -notmatch 'pongbot-calib-tool') { throw "unexpected --version output: $versionOut" }
          Compress-Archive -Path "dist/$bundle" -DestinationPath "dist/$archive.zip" -Force
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/pongbot-calib-tool-${{ env.RELEASE_VERSION }}-windows-x86_64.zip
          if-no-files-found: error

  build-linux:
    name: Build linux-x86_64 (Ubuntu ${{ matrix.ubuntu }})
    needs:
      - validate-release
      - build-i2c-helper-linux-aarch64
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04"]
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
      UBUNTU_TAG: ${{ matrix.ubuntu }}
      # bundle 的 OpenCV/FFmpeg .so 与 exe 同目录：DT_RPATH=$ORIGIN（--disable-new-dtags，
      # RPATH 递归解析传递依赖；RUNPATH 不递归会导致 libavcodec→libswresample 查找失败）。
      RUSTFLAGS: '-C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,--disable-new-dtags'

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            file \
            git \
            pkg-config \
            python3 \
            fonts-wqy-microhei \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxcb-icccm4-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-composite0-dev \
            libxcb-xinerama0-dev \
            libxcb-xinput-dev
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download Linux AArch64 I2C helper
        uses: actions/download-artifact@v4
        with:
          name: i2c-helper-linux-aarch64
          path: helper-sidecar
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned OpenCV 5 dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/opencv5_dependency.py prepare \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
      - name: Prepare pinned FFmpeg dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ffmpeg_dependency.py prepare \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
      - name: Build native ImGui frontend
        run: |
          cargo build --release --locked -p pongbot-calib-tool
          test -f target/release/pongbot-calib-tool
      - name: Package Linux release
        shell: bash
        run: |
          set -euo pipefail
          bundle="pongbot-calib-tool-linux-x86_64-ubuntu${UBUNTU_TAG}"
          archive="pongbot-calib-tool-${RELEASE_VERSION}-linux-x86_64-ubuntu${UBUNTU_TAG}"
          mkdir -p "dist/$bundle"
          cp target/release/pongbot-calib-tool "dist/$bundle/"
          cp helper-sidecar/camera-i2c-helper "dist/$bundle/"
          cp README.md "dist/$bundle/"
          # CJK 字体（文泉驿微米黑，OFL 可再分发）：保证无系统字体时中文正常显示。
          mkdir -p "dist/$bundle/fonts"
          cp /usr/share/fonts/truetype/wqy/wqy-microhei.ttc "dist/$bundle/fonts/"
          python3 scripts/opencv5_dependency.py bundle --destination "dist/$bundle"
          python3 scripts/ffmpeg_dependency.py bundle --destination "dist/$bundle"
          version_out="$(dist/$bundle/pongbot-calib-tool --version)"
          echo "$version_out"
          case "$version_out" in *pongbot-calib-tool*) ;; *) echo "unexpected --version output" >&2; exit 1 ;; esac
          tar -czf "dist/$archive.tar.gz" -C dist "$bundle"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-ubuntu-${{ matrix.ubuntu }}
          path: dist/pongbot-calib-tool-${{ env.RELEASE_VERSION }}-linux-x86_64-ubuntu${{ matrix.ubuntu }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macos-aarch64
    needs:
      - validate-release
      - build-i2c-helper-linux-aarch64
    runs-on: macos-14
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download Linux AArch64 I2C helper
        uses: actions/download-artifact@v4
        with:
          name: i2c-helper-linux-aarch64
          path: helper-sidecar
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare pinned OpenCV 5 dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/opencv5_dependency.py prepare \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
      - name: Prepare pinned FFmpeg dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ffmpeg_dependency.py prepare \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build native ImGui frontend
        run: |
          cargo build --release --locked -p pongbot-calib-tool
          test -f target/release/pongbot-calib-tool
      - name: Package macOS release
        run: |
          set -euo pipefail
          bundle="pongbot-calib-tool-macos-aarch64"
          archive="pongbot-calib-tool-${RELEASE_VERSION}-macos-aarch64"
          mkdir -p "dist/$bundle"
          cp target/release/pongbot-calib-tool "dist/$bundle/"
          cp helper-sidecar/camera-i2c-helper "dist/$bundle/"
          cp README.md "dist/$bundle/"
          python3 scripts/opencv5_dependency.py bundle --destination "dist/$bundle"
          python3 scripts/ffmpeg_dependency.py bundle --destination "dist/$bundle"
          # 资产 dylib 的 install_name 指向构建机绝对路径：统一改写为 @loader_path，
          # 让 exe 与 dylib 按 bundle 同目录解析（解压即用）。
          for f in "dist/$bundle/pongbot-calib-tool" "dist/$bundle"/*.dylib; do
            [ -f "$f" ] || continue
            install_name_tool -id "@loader_path/$(basename "$f")" "$f" 2>/dev/null || true
            otool -L "$f" | tail -n +2 | awk '{print $1}' \
              | grep -E '^/' | grep -vE '^(/usr/lib|/System|/Library)' | while read -r dep; do
                install_name_tool -change "$dep" "@loader_path/$(basename "$dep")" "$f" || true
              done || true
          done
          # Apple Silicon 强制要求签名：codesign 不接受非 .app 目录（bundle format
          # unrecognized），对 exe 与全部 dylib 逐个做 ad-hoc 签名。
          for f in "dist/$bundle/pongbot-calib-tool" "dist/$bundle"/*.dylib; do
            [ -f "$f" ] && codesign --force -s - "$f"
          done
          version_out="$(dist/$bundle/pongbot-calib-tool --version)"
          echo "$version_out"
          case "$version_out" in *pongbot-calib-tool*) ;; *) echo "unexpected --version output" >&2; exit 1 ;; esac
          ditto -c -k --sequesterRsrc --keepParent "dist/$bundle" "dist/$archive.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-aarch64
          path: dist/pongbot-calib-tool-${{ env.RELEASE_VERSION }}-macos-aarch64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - validate-release
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release archives
        run: |
          test -f "dist/pongbot-calib-tool-${RELEASE_VERSION}-windows-x86_64.zip"
          test -f "dist/pongbot-calib-tool-${RELEASE_VERSION}-linux-x86_64-ubuntu20.04.tar.gz"
          test -f "dist/pongbot-calib-tool-${RELEASE_VERSION}-linux-x86_64-ubuntu22.04.tar.gz"
          test -f "dist/pongbot-calib-tool-${RELEASE_VERSION}-macos-aarch64.zip"
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/pongbot-calib-tool-*
