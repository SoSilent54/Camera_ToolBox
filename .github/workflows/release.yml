name: Release

# pongbot-calib-tool 独立发布流水线（原生 ImGui + winit 前端）。
# 仅存在于 calib_tool_godot 分支；tag v* 推送或手动触发。
# 模式对齐 Camera_ToolBox 的 release.yml：i2c-helper 静态 sidecar +
# Windows x86_64 构建 + OpenCV/FFmpeg 依赖 bundle + GitHub Release 发布。

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${RELEASE_TAG}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must be a safe semantic version like v0.1.0 or v0.1.0-rc.1: ${version}" >&2
            exit 1
          fi
          echo "release_version=${version}" >> "${GITHUB_OUTPUT}"

  build-i2c-helper-linux-aarch64:
    name: Build static Linux AArch64 I2C helper
    needs: validate-release
    runs-on: ubuntu-22.04-arm
    container:
      image: ubuntu:20.04

    steps:
      - name: Install helper build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            pkg-config
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build static helper
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-gnu \
            --package camera-i2c-helper \
            --bin camera-i2c-helper
          helper=target/aarch64-unknown-linux-gnu/release/camera-i2c-helper
          file "$helper" | grep -Eq 'ELF 64-bit LSB.*ARM aarch64'
          if readelf -l "$helper" | grep -q 'Requesting program interpreter'; then
            echo 'I2C helper must be statically linked' >&2
            exit 1
          fi
      - name: Upload Linux AArch64 helper
        uses: actions/upload-artifact@v4
        with:
          name: i2c-helper-linux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/camera-i2c-helper
          if-no-files-found: error

  build-windows:
    name: Build windows-x86_64
    needs:
      - validate-release
      - build-i2c-helper-linux-aarch64
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download Linux AArch64 I2C helper
        uses: actions/download-artifact@v4
        with:
          name: i2c-helper-linux-aarch64
          path: helper-sidecar
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --yes --no-progress
      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare pinned OpenCV 5 dependency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/opencv5_dependency.py prepare \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
      - name: Prepare pinned FFmpeg dependency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ffmpeg_dependency.py prepare \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build native ImGui frontend
        shell: pwsh
        run: |
          cargo build --release --locked -p pongbot-calib-tool
          if (-not (Test-Path target/release/pongbot-calib-tool.exe)) { throw "pongbot-calib-tool.exe 未生成" }
      - name: Package Windows release
        shell: pwsh
        run: |
          $bundle = "pongbot-calib-tool-windows-x86_64"
          $archive = "pongbot-calib-tool-$env:RELEASE_VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$bundle" | Out-Null
          Copy-Item "target/release/pongbot-calib-tool.exe" "dist/$bundle/"
          Copy-Item "helper-sidecar/camera-i2c-helper" "dist/$bundle/camera-i2c-helper-linux-aarch64"
          Copy-Item README.md "dist/$bundle/"
          & $env:PYTHON scripts/opencv5_dependency.py bundle --destination "dist/$bundle"
          & $env:PYTHON scripts/ffmpeg_dependency.py bundle --destination "dist/$bundle"
          # 冒烟：--version 不初始化窗口/GL，直接验证二进制可执行且依赖 bundle 齐全。
          $versionOut = & "dist/$bundle/pongbot-calib-tool.exe" --version
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$bundle-smoke.log" -ErrorAction SilentlyContinue
            throw "pongbot-calib-tool.exe --version failed with exit $LASTEXITCODE"
          }
          if ("$versionOut" -notmatch 'pongbot-calib-tool') { throw "unexpected --version output: $versionOut" }
          Compress-Archive -Path "dist/$bundle" -DestinationPath "dist/$archive.zip" -Force
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/pongbot-calib-tool-${{ env.RELEASE_VERSION }}-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - validate-release
      - build-windows
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release archives
        run: |
          test -f "dist/pongbot-calib-tool-${RELEASE_VERSION}-windows-x86_64.zip"
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/pongbot-calib-tool-*.zip
